<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page Not Found | The Club at MariMack</title>
    <link
      rel="shortcut icon"
      type="image/x-icon"
      href="/assets/images/fav.png"
    />
    <link rel="stylesheet" href="/assets/css/vendor/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <main>
      <div class="container d-flex justify-content-center align-items-center">
        <div class="_404-card">
          <div class="frame"></div>
          <img
            src="/assets/images/service/disgruntled.svg"
            alt=""
            class="disgruntled"
          />
          <h1>Looks like you found the rough!</h1>
          <p>We were wondering where we put that...</p>
          <a href="/">Return Home</a>
        </div>
      </div>
    </main>
  </body>
  <style>
    body,
    main,
    .container {
      height: 100vh;
    }
    main {
      background-image: url("/assets/images/service/canvas.webp");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    h1 {
      font-size: 25px;
      margin-bottom: 5px;
      padding-top: 2rem;
    }
    p {
      color: rgb(90, 88, 86);
      margin-bottom: 1.5rem;
    }
    a {
      text-align: center;
      display: inline-block;
      margin: 0 auto;
      text-decoration: none;
      padding: 6px 15px;
      background-color: #f7f7f7;
      color: grey;
      transition: background-color 0.15s ease, color .15s ease;
      &:hover {
        background-color: #e4eae3;
      }
    }
    h1,
    p {
      text-align: center;
    }
    ._404-card {
      position: relative;
      display: flex;
      align-items: center;
      flex-direction: column;
      padding: 4.5rem 5rem 5rem;
      width: 525px;
      background: white;
      box-shadow:
        rgba(0, 0, 0, 0.1) 0px 10px 15px -3px,
        rgba(0, 0, 0, 0.05) 0px 4px 6px -2px;
      border-radius: 10px;
      .frame {
        pointer-events: none;
        position: absolute;
        width: calc(100% - 25px);
        height: calc(100% - 25px);
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        border: #226a35 1.5px solid;
        border-radius: 6px;
      }
      .disgruntled {
        display: block;
        margin: 0 auto;
        width: 75%;
        height: auto;
      }
    }
  </style>
</html>
